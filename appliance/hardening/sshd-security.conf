# Template: setup-hardening.sh replaces @ADMIN_USER@ and installs this as
# /etc/ssh/sshd_config.d/01-security-cam.conf.
#
# sshd keeps the FIRST value it reads for each keyword. Raspberry Pi OS
# provisions through cloud-init, which can drop a 50-cloud-init.conf that
# sets "PasswordAuthentication yes"; a 90-* file would silently lose to it,
# so this one has to sort first.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AllowUsers @ADMIN_USER@

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
PermitOpen 127.0.0.1:8080
GatewayPorts no
PermitTunnel no

MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
